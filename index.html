<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wielki Niedźwiedź – mapy</title>
<meta name="description" content="Interaktywne mapy regionów The Long Dark: przybliżanie, porównanie Pilgrim i Interloper, pinezki, trasy, mgła wojny i planer przejść między regionami.">
<meta name="theme-color" content="#0b1419">
<meta property="og:title" content="Wielki Niedźwiedź – mapy The Long Dark">
<meta property="og:description" content="Interaktywne mapy wszystkich regionów The Long Dark po polsku.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Barlow:wght@400;500;600&display=swap">
<link rel="preconnect" href="https://images.steamusercontent.com" crossorigin>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <button class="ib only-m" id="openSide" aria-label="Lista map">☰</button>
    <div class="brand"><span class="k">The Long Dark</span><span class="b">Wielki Niedźwiedź</span></div>
    <button class="search" id="openSearch" aria-label="Szukaj">
      <span>Szukaj mapy lub miejsca…</span><kbd>Ctrl K</kbd>
    </button>
    <div class="seg" role="group" aria-label="Wersja mapy" id="varSeg">
      <button data-v="pilgrim"><span class="lf">Pilgrim–Stalker</span><span class="sf">Pilgrim</span></button>
      <button data-v="interloper"><span class="lf">Interloper–Misery</span><span class="sf">Interloper</span></button>
      <button data-v="compare">Porównaj</button>
    </div>
    <div class="prog" id="prog" title="Odwiedzone regiony"></div>
    <div class="menuwrap">
      <button class="ib" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">⋯</button>
      <div class="menu" id="menu" hidden>
        <button data-act="export">Eksportuj moje dane (JSON)</button>
        <label class="mi">Importuj dane…<input type="file" id="importFile" accept="application/json" hidden></label>
        <button data-act="keys">Skróty klawiszowe</button>
        <button data-act="about">O stronie i autorach map</button>
        <hr>
        <button data-act="reset" class="danger">Usuń moje dane…</button>
      </div>
    </div>
    <button class="ib only-m" id="openInsp" aria-label="Szczegóły">ⓘ</button>
  </header>

  <aside class="side" id="side">
    <div class="nav">
      <svg id="navmap" viewBox="0 0 1180 640" role="img" aria-label="Nawigator – szkic wyspy"></svg>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="toolopts" id="toolopts"></div>
    <div class="viewer" id="viewer" tabindex="0" aria-label="Mapa">
      <div class="layer" id="layer">
        <img id="imgA" alt="" draggable="false">
        <img id="imgB" alt="" draggable="false" hidden>
        <canvas id="fog" hidden></canvas>
        <svg id="draw" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="pinsL"></div>
      </div>
      <div class="sketchwrap" id="sketchWrap" hidden><svg id="sketch" viewBox="0 0 1180 640" role="img" aria-label="Szkic połączeń regionów"></svg></div>
      <div class="cmp" id="cmp" hidden><span class="l">Pilgrim–Stalker</span><span class="h" id="cmpHandle" tabindex="0" role="slider" aria-label="Suwak porównania" aria-valuemin="0" aria-valuemax="100"></span><span class="r">Interloper–Misery</span></div>
      <div class="status" id="status"></div>

      <div class="tools" role="toolbar" aria-label="Narzędzia">
        <button data-tool="pan" title="Przesuwanie (V)"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg><span>Przesuń</span></button>
        <button data-tool="pin" title="Pinezka (P)"><svg viewBox="0 0 24 24"><path d="M12 22s-7-7.5-7-12a7 7 0 0 1 14 0c0 4.5-7 12-7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Pinezka</span></button>
        <button data-tool="route" title="Trasa (R)"><svg viewBox="0 0 24 24"><path d="M4 19c4 0 3-7 8-7s4-7 8-7"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="5" r="2"/></svg><span>Trasa</span></button>
        <button data-tool="fog" title="Mgła wojny (F)"><svg viewBox="0 0 24 24"><path d="M3 9h13M6 13h15M3 17h12"/><circle cx="18" cy="8" r="3"/></svg><span>Mgła</span></button>
        <button data-tool="erase" title="Gumka (E)"><svg viewBox="0 0 24 24"><path d="M4 16l9-9 6 6-6 6H8z"/><path d="M13 19h7"/></svg><span>Gumka</span></button>
      </div>

      <div class="zoom">
        <button id="zin" title="Przybliż (+)" aria-label="Przybliż">+</button>
        <button id="zout" title="Oddal (−)" aria-label="Oddal">−</button>
        <button id="zfit" title="Dopasuj (0)" aria-label="Dopasuj">⤢</button>
        <button id="zfull" title="Pełny ekran" aria-label="Pełny ekran">⛶</button>
      </div>
      <canvas class="mini" id="mini" width="200" height="140" aria-label="Minimapa"></canvas>
      <div class="foot"><span id="zread">100%</span><span id="credit"></span></div>
    </div>
  </main>

  <aside class="insp" id="insp">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="info" aria-selected="true">Informacje</button>
      <button role="tab" data-tab="notes" aria-selected="false">Moje notatki</button>
      <button role="tab" data-tab="plan" aria-selected="false">Planer trasy</button>
    </div>
    <div class="tabbody" id="tabbody"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
</div>

<div class="palette" id="palette" hidden>
  <div class="pbox" role="dialog" aria-modal="true" aria-label="Szukaj">
    <input id="pq" type="search" placeholder="Region, strefa, miejsce (PL lub EN)…" autocomplete="off" aria-label="Szukaj">
    <ul id="pres" role="listbox"></ul>
    <div class="phint"><kbd>↑</kbd><kbd>↓</kbd> wybór · <kbd>Enter</kbd> otwórz · <kbd>Esc</kbd> zamknij</div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div id="mbody"></div><div class="mact"><button class="btn" id="mclose">Zamknij</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/maps-fallback.js"></script>
<script src="assets/data.js"></script>
<script src="assets/sketch.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
